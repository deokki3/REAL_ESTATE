<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin:0; font-family:'Noto Sans KR', system-ui, sans-serif; background: oklch(18% 0.012 260); color: oklch(92% 0.005 260); }

    .chip { display:inline-flex; align-items:center; padding:7px 14px; border-radius:8px; font-size:12.5px; background: oklch(24% 0.012 260); border:1px solid oklch(32% 0.014 260); color: oklch(75% 0.01 260); }
    .chip.active { background: oklch(80% 0.16 195); border-color: oklch(80% 0.16 195); color: oklch(18% 0.012 260); font-weight:700; }

    .card { background: oklch(23% 0.012 260); border:1px solid oklch(30% 0.014 260); border-radius:10px; padding:18px 20px; display:flex; align-items:center; gap:16px; }
    .badge { display:inline-flex; align-items:center; padding:3px 9px; border-radius:5px; font-size:11px; font-weight:700; letter-spacing:0.01em; }
    .badge-open { background: oklch(80% 0.16 195); color: oklch(16% 0.01 260); }
    .badge-type { background: oklch(28% 0.012 260); color: oklch(75% 0.01 260); border:1px solid oklch(35% 0.014 260); }

    .chev { flex-shrink:0; color: oklch(55% 0.01 260); }
  </style>
</helmet>

<div style="width:440px; padding:28px; display:flex; flex-direction:column; gap:18px;">
  <div>
    <div style="font-size:22px; font-weight:800; letter-spacing:-0.01em;">공고 리스트</div>
    <div style="font-size:12.5px; color: oklch(60% 0.01 260); margin-top:4px;">LH · 청약홈 공고를 한눈에</div>
  </div>

  <div style="display:flex; gap:8px; flex-wrap:wrap;">
    <span class="chip active">서울</span>
    <span class="chip">임대주택</span>
    <span class="chip">접수중</span>
  </div>

  <div style="display:flex; flex-direction:column; gap:10px;">
    <div class="card">
      <div style="display:flex; flex-direction:column; gap:6px; flex-shrink:0;">
        <span class="badge badge-open">접수중</span>
        <span class="badge badge-type">임대주택</span>
      </div>
      <div style="flex:1; min-width:0;">
        <div style="font-size:14.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">성남 위례 A1-5BL 행복주택 모집공고</div>
        <div style="font-size:12px; color:oklch(60% 0.01 260); margin-top:4px;">경기 성남 · 아파트 · 08.29 마감</div>
      </div>
      <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>

    <div class="card">
      <div style="display:flex; flex-direction:column; gap:6px; flex-shrink:0;">
        <span class="badge" style="background: oklch(30% 0.012 260); color: oklch(75% 0.01 260);">공고중</span>
        <span class="badge badge-type">분양주택</span>
      </div>
      <div style="flex:1; min-width:0;">
        <div style="font-size:14.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">화성 동탄2 A94블록 공공분양 모집공고</div>
        <div style="font-size:12px; color:oklch(60% 0.01 260); margin-top:4px;">경기 화성 · 아파트 · 08.25 마감</div>
      </div>
      <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
  </div>

  <button type="button" style="align-self:flex-start; background: oklch(80% 0.16 195); color:oklch(16% 0.01 260); border:none; border-radius:8px; padding:10px 20px; font-size:13px; font-weight:800; font-family:inherit; cursor:pointer;">더 많은 공고 보기</button>
</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
