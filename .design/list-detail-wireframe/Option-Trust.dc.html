<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=Noto+Sans+KR:wght@400;500;600&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin:0; font-family:'Noto Sans KR', system-ui, sans-serif; background: oklch(98% 0.004 250); color: oklch(24% 0.006 255); }
    h1,h2,.heading { font-family:'Noto Serif KR', serif; }

    .chip { display:inline-flex; align-items:center; padding:7px 15px; border-radius:6px; font-size:12.5px; background:#fff; border:1px solid oklch(85% 0.006 255); color: oklch(38% 0.006 255); }
    .chip.active { background: oklch(45% 0.15 255); border-color: oklch(45% 0.15 255); color:#fff; }

    .card { background:#fff; border:1px solid oklch(89% 0.005 255); border-top:3px solid oklch(45% 0.15 255); border-radius:8px; padding:18px 20px; display:flex; align-items:center; gap:16px; }
    .badge { display:inline-flex; align-items:center; padding:3px 10px; border-radius:5px; font-size:11px; font-weight:600; border:1px solid oklch(85% 0.006 255); }
    .badge-open { background: oklch(45% 0.15 255 / 0.08); color: oklch(45% 0.15 255); border-color: oklch(45% 0.15 255 / 0.35); }
    .badge-type { background: oklch(97% 0.004 255); color: oklch(40% 0.006 255); }

    .chev { flex-shrink:0; color: oklch(70% 0.006 255); }
  </style>
</helmet>

<div style="width:440px; padding:28px; display:flex; flex-direction:column; gap:18px;">
  <div>
    <div class="heading" style="font-size:21px; font-weight:700; color: oklch(22% 0.008 255);">공고 리스트</div>
    <div style="font-size:12.5px; color: oklch(48% 0.006 255); margin-top:4px;">LH · 청약홈 공고를 정확하게 한 곳에서</div>
  </div>

  <div style="display:flex; gap:8px; flex-wrap:wrap;">
    <span class="chip active">서울</span>
    <span class="chip">임대주택</span>
    <span class="chip">접수중</span>
  </div>

  <div style="display:flex; flex-direction:column; gap:10px;">
    <div class="card">
      <div style="display:flex; flex-direction:column; gap:6px; flex-shrink:0;">
        <span class="badge badge-open">접수중</span>
        <span class="badge badge-type">임대주택</span>
      </div>
      <div style="flex:1; min-width:0;">
        <div style="font-size:14.5px; font-weight:600; color:oklch(24% 0.006 255); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">성남 위례 A1-5BL 행복주택 모집공고</div>
        <div style="font-size:12px; color:oklch(50% 0.006 255); margin-top:4px;">경기 성남 · 아파트 · 08.29 마감</div>
      </div>
      <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>

    <div class="card">
      <div style="display:flex; flex-direction:column; gap:6px; flex-shrink:0;">
        <span class="badge" style="background: oklch(97% 0.004 255); color: oklch(48% 0.006 255);">공고중</span>
        <span class="badge badge-type">분양주택</span>
      </div>
      <div style="flex:1; min-width:0;">
        <div style="font-size:14.5px; font-weight:600; color:oklch(24% 0.006 255); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">화성 동탄2 A94블록 공공분양 모집공고</div>
        <div style="font-size:12px; color:oklch(50% 0.006 255); margin-top:4px;">경기 화성 · 아파트 · 08.25 마감</div>
      </div>
      <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
  </div>

  <button type="button" style="align-self:flex-start; background: oklch(45% 0.15 255); color:#fff; border:none; border-radius:6px; padding:10px 20px; font-size:13px; font-weight:600; font-family:inherit; cursor:pointer;">더 많은 공고 보기</button>
</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
