<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin:0; font-family:'Noto Sans KR', system-ui, sans-serif; background: oklch(97% 0.018 75); color: oklch(28% 0.02 60); }
    h1,h2,.heading { font-family:'Gowun Dodum', 'Noto Sans KR', sans-serif; }

    .chip { display:inline-flex; align-items:center; padding:7px 15px; border-radius:999px; font-size:12.5px; background:#fff; border:1px solid oklch(88% 0.02 70); color: oklch(40% 0.02 60); }
    .chip.active { background: oklch(64% 0.13 42); border-color: oklch(64% 0.13 42); color:#fff; }

    .card { background:#fff; border-radius:18px; padding:18px 20px; box-shadow: 0 6px 18px -8px oklch(55% 0.08 50 / 0.35); display:flex; align-items:center; gap:16px; }
    .badge { display:inline-flex; align-items:center; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:600; }
    .badge-open { background: oklch(64% 0.13 42 / 0.16); color: oklch(50% 0.14 42); }
    .badge-type { background: oklch(93% 0.02 75); color: oklch(45% 0.02 60); }

    .chev { flex-shrink:0; color: oklch(70% 0.02 60); }
  </style>
</helmet>

<div style="width:440px; padding:28px; display:flex; flex-direction:column; gap:18px;">
  <div>
    <div class="heading" style="font-size:22px; font-weight:400; color: oklch(30% 0.03 55);">공고 리스트</div>
    <div style="font-size:12.5px; color: oklch(50% 0.02 60); margin-top:4px;">LH · 청약홈 공고를 한 곳에서, 따뜻하게</div>
  </div>

  <div style="display:flex; gap:8px; flex-wrap:wrap;">
    <span class="chip active">서울</span>
    <span class="chip">임대주택</span>
    <span class="chip">접수중</span>
  </div>

  <div style="display:flex; flex-direction:column; gap:12px;">
    <div class="card">
      <div style="display:flex; flex-direction:column; gap:6px; flex-shrink:0;">
        <span class="badge badge-open">접수중</span>
        <span class="badge badge-type">임대주택</span>
      </div>
      <div style="flex:1; min-width:0;">
        <div style="font-size:14.5px; font-weight:600; color:oklch(28% 0.02 60); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">성남 위례 A1-5BL 행복주택 모집공고</div>
        <div style="font-size:12px; color:oklch(55% 0.02 60); margin-top:4px;">경기 성남 · 아파트 · 08.29 마감</div>
      </div>
      <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>

    <div class="card">
      <div style="display:flex; flex-direction:column; gap:6px; flex-shrink:0;">
        <span class="badge" style="background: oklch(93% 0.02 75); color: oklch(45% 0.02 60);">공고중</span>
        <span class="badge badge-type">분양주택</span>
      </div>
      <div style="flex:1; min-width:0;">
        <div style="font-size:14.5px; font-weight:600; color:oklch(28% 0.02 60); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">화성 동탄2 A94블록 공공분양 모집공고</div>
        <div style="font-size:12px; color:oklch(55% 0.02 60); margin-top:4px;">경기 화성 · 아파트 · 08.25 마감</div>
      </div>
      <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
  </div>

  <button type="button" style="align-self:flex-start; background: oklch(64% 0.13 42); color:#fff; border:none; border-radius:999px; padding:10px 22px; font-size:13px; font-weight:600; font-family:inherit; cursor:pointer;">더 많은 공고 보기</button>
</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
